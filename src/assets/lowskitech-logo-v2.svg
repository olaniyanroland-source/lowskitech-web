<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" gradientUnits="userSpaceOnUse" x1="380" y1="200" x2="664" y2="530">
      <stop offset="0%" stop-color="#1fb6f0"/>
      <stop offset="55%" stop-color="#2f7bf5"/>
      <stop offset="100%" stop-color="#3c3cf2"/>
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#2f8dff"/>
    </linearGradient>
  </defs>

  <!-- mark: a blocky "L" built like code, finished with a text-cursor accent -->
  <rect x="380" y="200" width="112" height="330" rx="32" fill="url(#blueGrad)"/>
  <rect x="380" y="440" width="232" height="90" rx="28" fill="url(#blueGrad)"/>
  <rect x="632" y="440" width="34" height="90" rx="8" fill="#0b1220"/>

  <!-- wordmark -->
  <text x="500" y="700" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130">
    <tspan fill="#0b1220">lowski</tspan><tspan fill="url(#techGrad)">tech</tspan>
  </text>

  <!-- tagline -->
  <text x="500" y="758" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="28"
        letter-spacing="8" fill="#8a94a6">
    WEB DEVELOPMENT STUDIO
  </text>
</svg>
